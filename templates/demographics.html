<!DOCTYPE html>
<html>
<head>
<title>Demographics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="card">
<h2>Demographic Questions</h2>
<form method="POST">

<div class="form-group">
  <label>Age</label>
  <input type="number" name="age" required>
</div>

<div class="form-group">
  <label>Sex</label>
  <div class="radio-row"><input type="radio" name="sex" value="Male" required id="sex_m"><label for="sex_m">Male</label></div>
  <div class="radio-row"><input type="radio" name="sex" value="Female" id="sex_f"><label for="sex_f">Female</label></div>
</div>

<div class="form-group">
  <label>Gender</label>
  <div class="radio-row"><input type="radio" name="gender" value="Woman" id="g_w"><label for="g_w">Woman</label></div>
  <div class="radio-row"><input type="radio" name="gender" value="Man" id="g_m"><label for="g_m">Man</label></div>
  <div class="radio-row"><input type="radio" name="gender" value="Non-binary" id="g_nb"><label for="g_nb">Non-binary</label></div>
  <div class="radio-row"><input type="radio" name="gender" value="Prefer not to say" id="g_p"><label for="g_p">Prefer not to say</label></div>
  <input type="text" name="gender_other" placeholder="Or self-describe">
</div>

<div class="form-group">
  <label>Ethnic origin / race (select all that apply)</label>
  <div class="checkbox-row"><input type="checkbox" name="ethnicity" value="White" id="e1"><label for="e1">White</label></div>
  <div class="checkbox-row"><input type="checkbox" name="ethnicity" value="Hispanic or Latino" id="e2"><label for="e2">Hispanic or Latino</label></div>
  <div class="checkbox-row"><input type="checkbox" name="ethnicity" value="Black or African American" id="e3"><label for="e3">Black or African American</label></div>
  <div class="checkbox-row"><input type="checkbox" name="ethnicity" value="Native American or American Indian" id="e4"><label for="e4">Native American or American Indian</label></div>
  <div class="checkbox-row"><input type="checkbox" name="ethnicity" value="Asian/Pacific Islander" id="e5"><label for="e5">Asian/Pacific Islander</label></div>
  <input type="text" name="ethnicity_other" placeholder="Or self-describe">
</div>

<div class="form-group">
  <label>Education Level</label>
  <select name="education" required>
    <option value="Less than high school">Less than high school</option>
    <option value="High school or equivalent">High school or equivalent</option>
    <option value="Some college">Some college</option>
    <option value="Associate's degree">Associate's degree</option>
    <option value="Bachelor's degree">Bachelor's degree</option>
    <option value="Graduate degree">Graduate degree</option>
  </select>
</div>

<div class="form-group">
  <label>Experience working / interacting with robots</label>
  <select name="robot_experience" required>
    <option value="None">None</option>
    <option value="A little">A little</option>
    <option value="Some">Some</option>
    <option value="A lot">A lot</option>
  </select>
</div>

<button type="submit" class="btn btn-primary">Next</button>
</form>
</div>
</body>
</html>
